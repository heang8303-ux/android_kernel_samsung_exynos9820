name: Build S10 Series Kernels with KernelSU Next v3.3.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "beyond0lte"
            name: "Galaxy S10e"
            defconfig: "exynos9820-beyond0lte_defconfig"
          - device: "beyond1lte"
            name: "Galaxy S10"
            defconfig: "exynos9820-beyond1lte_defconfig"
          - device: "beyond2lte"
            name: "Galaxy S10 Plus"
            defconfig: "exynos9820-beyond2lte_defconfig"
          - device: "beyondx"
            name: "Galaxy S10 5G"
            defconfig: "exynos9820-beyondx_defconfig"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev binutils-aarch64-linux-gnu \
            clang lld llvm

      - name: Integrate KernelSU Next (v3.3.0)
        run: |
          # 1. Clean up and clone specific v3.3.0 tag
          rm -rf drivers/kernelsu
          git clone --depth=1 --branch v3.3.0 https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu
          
          # 2. Add KernelSU build entry to drivers/Makefile if not present
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # 3. Add KernelSU menu entry dynamically based on file presence
          if ! grep -q "kernelsu" drivers/Kconfig; then
            if [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
              sed -i '/endmenu/i source "drivers/kernelsu/kernel/Kconfig"' drivers/Kconfig
            elif [ -f "drivers/kernelsu/Kconfig" ]; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            fi
          fi
          
          # 4. Inject mandatory KernelSU Next & 4.14 compatibility configs into target defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${{ matrix.defconfig }}"
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_TAMPER_SYS_PROC_ATTR=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG_PATH
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_PATH

      - name: Compile Exynos Kernel (${{ matrix.device }})
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          rm -rf out
          mkdir -p out
          
          make O=out ${{ matrix.defconfig }}
          
          # KCFLAGS="-w" bypasses legacy 4.14 Clang syntax warnings from halting the build
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-w" \
            KAFLAGS="-w"

      - name: Package AnyKernel3 Zip
        run: |
          rm -rf ak3
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          
          # 1. Disable device check
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          
          # 2. Force Samsung Exynos boot block path using pipe separator
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          # 3. Copy compiled kernel image
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz ak3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ak3/Image
          fi
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak3/dtbo.img
          fi

          mkdir -p release
          ZIP_NAME="Kernel-${{ matrix.device }}-KSUNext-v3.3.0.zip"
          
          cd ak3
          zip -r9 "../release/${ZIP_NAME}" * -x .git\* README.md
          cd ..

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-Kernel-v3.3.0
          path: release/Kernel-${{ matrix.device }}-KSUNext-v3.3.0.zip

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
