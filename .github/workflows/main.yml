name: Build LineageOS S10 5G Kernel

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build-kernel:
    name: Compiling LineageOS Exynos 9820
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

      - name: Build Android Kernel
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          # Tells the builder action that source code resides in the current working directory
          kernel-url: .
          
          # The unified target config for Samsung Exynos 9820 platform devices
          config: exynos9820_defconfig
          arch: arm64
          
          # Force use AOSP Clang toolchain as required by LineageOS build parameters
          aosp-clang: true
          
          # Target standard Clang 14 tracking binary (r450784d) for contemporary Lineage trees
          clang-version: r450784d
          
          # Passes direct LLVM instructions to substitute standard GNU binutils
          extra-cmd: LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          
          # Explicitly disable integrated root injection for a pure stock compile phase
          ksu: false

      - name: Process Raw Image Binary
        run: |
          # Locate the newly compiled binary inside the working directory workspace 
          # and copy it outwards as a standardized flashable partition image
          if [ -f AnyKernel3/Image.gz-dtb ]; then
            cp AnyKernel3/Image.gz-dtb S10_5G_Kernel.img
            echo "SUCCESS: Found Image.gz-dtb and created standalone .img"
          elif [ -f AnyKernel3/Image ]; then
            cp AnyKernel3/Image S10_5G_Kernel.img
            echo "SUCCESS: Found uncompressed Image and created standalone .img"
          else
            echo "WARNING: Kernel binary location anomalous. Check logs."
          fi

      - name: Upload Flashable Zip and Standalone Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-Kernel-Outputs
          path: |
            AnyKernel3/*.zip
            S10_5G_Kernel.img
            
