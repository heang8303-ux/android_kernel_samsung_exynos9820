name: Build S10 5G (Exynos 9820) DTB & DTBO

on:
  workflow_dispatch:

jobs:
  build-dtb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies & GCC 10 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libncurses5-dev libncursesw5-dev \
            bison flex libelf-dev liblz4-tool bc ccache zip git wget \
            python3 device-tree-compiler gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Tools
        run: |
          mkdir -p tools
          cd tools
          # Download mkdtimg tool
          wget https://raw.githubusercontent.com/ravindu644/android_kernel_beyondx/stock-ramdisk/binaries/mkdtimg -O mkdtimg
          chmod +x mkdtimg

      - name: Build DTBs and Pack DTBO
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export PATH="${GITHUB_WORKSPACE}/tools:${PATH}"
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 1. Target defconfig for S10 5G
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -maxdepth 2 \( -name "*beyondx*" -o -name "*exynos9820*" \) -name "*defconfig*" | head -n 1 | xargs basename)
          echo "Using Defconfig: $DEFCONFIG_FILE"

          mkdir -p out

          # 2. Build configuration & DTBs
          make O=out $DEFCONFIG_FILE
          make -j$(nproc --all) O=out dtbs

          # 3. Filter ONLY S10 5G DTBOs (beyondx) to keep size under ~2-4MB
          DTBO_LIST=$(find out/arch/arm64/boot/dts/ -name "*beyondx*.dtbo")
          
          # Fallback to dts/exynos if no beyondx prefix exists
          if [ -z "$DTBO_LIST" ]; then
            DTBO_LIST=$(find out/arch/arm64/boot/dts/exynos/ -name "*.dtbo")
          fi

          if [ -n "$DTBO_LIST" ]; then
            mkdtimg create out/dtbo.img $DTBO_LIST
            echo "Successfully packed S10 5G dtbo.img"
          else
            echo "Error: No matching .dtbo files found!" && exit 1
          fi
          
      - name: Upload S10 5G DTB & DTBO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-DTB-DTBO
          path: output/*
          
