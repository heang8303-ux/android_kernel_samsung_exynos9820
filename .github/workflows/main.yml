name: Build S10 5G (Exynos 9820) DTB & DTBO

on:
  workflow_dispatch:

jobs:
  build-dtb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libncurses5-dev libncursesw5-dev \
            bison flex libelf-dev liblz4-tool bc ccache zip git wget \
            python3 device-tree-compiler

      - name: Setup Toolchain and Utilities
        run: |
          mkdir -p tools
          cd tools
          
          # Clone GCC 4.9 toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          
          # Download mkdtimg
          wget https://raw.githubusercontent.com/ravindu644/android_kernel_beyondx/stock-ramdisk/binaries/mkdtimg -O mkdtimg
          chmod +x mkdtimg

      - name: Build DTBs and Pack DTBO
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Set absolute paths to toolchains and utilities
          TOOLCHAIN_BIN="$(pwd)/tools/gcc64/bin"
          TOOLS_DIR="$(pwd)/tools"
          
          export PATH="${TOOLCHAIN_BIN}:${TOOLS_DIR}:${PATH}"
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Verify toolchain exists before building
          which aarch64-linux-android-gcc || (echo "Compiler not found in PATH!" && exit 1)
          
          DEFCONFIG="exynos9820-beyondxks_defconfig"
          
          mkdir -p out
          make O=out $DEFCONFIG
          make -j$(nproc --all) O=out dtbs
          
          DTBO_LIST=$(find out/arch/arm64/boot/dts/ -name "*.dtbo")
          if [ -n "$DTBO_LIST" ]; then
            mkdtimg create out/dtbo.img $DTBO_LIST
          fi

      - name: Upload S10 5G DTB & DTBO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-DTB-DTBO
          path: output/*
          
