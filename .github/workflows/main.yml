name: Build S10 5G (Exynos 9820) DTB & DTBO

on:
  workflow_dispatch:

jobs:
  build-dtb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libncurses5-dev libncursesw5-dev \
            bison flex libelf-dev liblz4-tool bc ccache zip git wget \
            python3 device-tree-compiler

      - name: Setup Toolchains & Utilities
        run: |
          mkdir -p tools
          cd tools

          # Clone reliable GitHub mirror of AOSP GCC 4.9 ARM64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64

          # Download mkdtimg
          wget https://raw.githubusercontent.com/ravindu644/android_kernel_beyondx/stock-ramdisk/binaries/mkdtimg -O mkdtimg
          chmod +x mkdtimg

      - name: Verify Compiler
        run: |
          # Ensure execution permissions on cloned toolchain binaries
          chmod -R +x tools/gcc64/bin/
          
          # Add toolchain to PATH for verification check
          export PATH="${GITHUB_WORKSPACE}/tools/gcc64/bin:${PATH}"
          
          # Output exact location of compiler to log
          which aarch64-linux-android-gcc || (echo "GCC binary not found!" && exit 1)

      - name: Build DTBs and Pack DTBO
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export PATH="${GITHUB_WORKSPACE}/tools/gcc64/bin:${GITHUB_WORKSPACE}/tools:${PATH}"
          export CROSS_COMPILE=aarch64-linux-android-

          # 1. Search for matching defconfig file
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -maxdepth 2 \( -name "*beyondx*" -o -name "*exynos9820*" \) -name "*defconfig*" | head -n 1 | xargs basename)

          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "ERROR: Could not automatically find a valid defconfig!"
            echo "Listing files inside arch/arm64/configs/:"
            ls -la arch/arm64/configs/
            exit 1
          fi

          echo "Found Target Defconfig: $DEFCONFIG_FILE"

          mkdir -p out

          # 2. Generate configuration
          make O=out $DEFCONFIG_FILE

          # 3. Build DTBs
          make -j$(nproc --all) O=out dtbs

          # 4. Pack DTBO Image
          DTBO_LIST=$(find out/arch/arm64/boot/dts/ -name "*.dtbo")
          if [ -n "$DTBO_LIST" ]; then
            mkdtimg create out/dtbo.img $DTBO_LIST
            echo "Successfully generated dtbo.img"
          else
            echo "Warning: No .dtbo files found!"
          fi
      - name: Collect Output Artifacts
        run: |
          mkdir -p output/dtbs

          # Collect compiled .dtb files
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} output/dtbs/ \;

          # Collect compiled dtbo.img
          if [ -f "out/dtbo.img" ]; then
            cp out/dtbo.img output/
          fi

      - name: Upload S10 5G DTB & DTBO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-DTB-DTBO
          path: output/*
          
