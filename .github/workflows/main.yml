name: Build LineageOS S10 5G Kernel

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build-kernel:
    name: Compiling LineageOS Exynos 9820
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev
          
       - name: Build Android Kernel
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: .
          config: exynos9820_defconfig
          arch: arm64
          
          # Force use AOSP Clang
          aosp-clang: true
          # The correct property name for this action to select Clang 14
          aosp-clang-version: r450784d
          
          # Toggle this to true to satisfy the action's validation rule
          aosp-gcc: true
          
          # The correct property name to pass LLVM flags to the Makefile
          extra-make-args: LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          
          ksu: false

      - name: Process Raw Image Binary
        run: |
          # Locate the newly compiled binary inside the working directory workspace 
          # and copy it outwards as a standardized flashable partition image
          if [ -f AnyKernel3/Image.gz-dtb ]; then
            cp AnyKernel3/Image.gz-dtb S10_5G_Kernel.img
            echo "SUCCESS: Found Image.gz-dtb and created standalone .img"
          elif [ -f AnyKernel3/Image ]; then
            cp AnyKernel3/Image S10_5G_Kernel.img
            echo "SUCCESS: Found uncompressed Image and created standalone .img"
          else
            echo "WARNING: Kernel binary location anomalous. Check logs."
          fi

      - name: Upload Flashable Zip and Standalone Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-Kernel-Outputs
          path: |
            AnyKernel3/*.zip
            S10_5G_Kernel.img
            
